[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auditlens"
version = "0.1.0"
description = "Analysis of SEC 10-K filings"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4",
    "lxml",
]

[tool.setuptools.packages.find]
include = ["auditlens*"]
